[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "asl-vision"
version = "1.0.0"
description = "Real-time American Sign Language letter detection service"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "AGPL-3.0-or-later" }
dependencies = [
    "flask==3.0.3",
    "ultralytics==8.2.102",
    "opencv-python==4.10.0.84",
    "numpy==1.26.4",
    "requests==2.32.3",
]

[project.optional-dependencies]
dev = ["pytest==8.3.3"]

[project.scripts]
asl-vision = "asl_vision.api:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
